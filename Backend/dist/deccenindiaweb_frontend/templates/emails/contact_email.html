<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #444;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 560px;
            margin: auto;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .detail {
            margin: 12px 0;
            font-size: 15px;
        }
        .label {
            font-weight: bold;
            color: #2c3e50;
            display: inline-block;
            width: 90px;
        }
        .message {
            margin-top: 16px;
            padding: 12px 14px;
            background: #f6f8fc;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .footer {
            margin-top: 25px;
            font-size: 13px;
            text-align: center;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>New website inquiry</h2>
        <div class="detail"><span class="label">Name:</span> {{ name }}</div>
        <div class="detail"><span class="label">Email:</span> {{ email }}</div>
        <div class="detail"><span class="label">Phone:</span> {{ phone }}</div>
        <div class="detail"><span class="label">Company:</span> {{ company }}</div>
        <div class="detail"><span class="label">Topic:</span> {{ topic }}</div>
        <div class="message">{{ message }}</div>
        <div class="footer">
            This is an automated email from the DIDeccan website contact form.
        </div>
    </div>
</body>
</html>
